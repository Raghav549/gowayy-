name: Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Optional private signing key (Settings → Secrets → Actions). Without it
      # the bundled sideload key in android/keystore is used.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Using the private key from repository secrets."
          else
            echo "Using the bundled sideload key."
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CUSTOMER_URL: ${{ vars.CUSTOMER_URL }}
          BUSINESS_URL: ${{ vars.BUSINESS_URL }}
          ADMIN_URL: ${{ vars.ADMIN_URL }}
        run: |
          ARGS=""
          if [ -n "$CUSTOMER_URL" ]; then ARGS="$ARGS -PcustomerUrl=$CUSTOMER_URL"; fi
          if [ -n "$BUSINESS_URL" ]; then ARGS="$ARGS -PbusinessUrl=$BUSINESS_URL"; fi
          if [ -n "$ADMIN_URL" ]; then ARGS="$ARGS -PadminUrl=$ADMIN_URL"; fi
          gradle -p android assembleCustomerRelease assembleBusinessRelease assembleAdminRelease --no-daemon --stacktrace $ARGS
          mkdir -p out
          cp android/app/build/outputs/apk/customer/release/app-customer-release.apk "out/gowayy-customer-1.0.${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/business/release/app-business-release.apk "out/gowayy-business-1.0.${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/admin/release/app-admin-release.apk "out/gowayy-admin-1.0.${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/customer/release/app-customer-release.apk out/gowayy.apk
          cp android/app/build/outputs/apk/business/release/app-business-release.apk out/gowayy-business.apk
          cp android/app/build/outputs/apk/admin/release/app-admin-release.apk out/gowayy-admin.apk
          for apk in out/gowayy.apk out/gowayy-business.apk out/gowayy-admin.apk; do "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify "$apk"; done

      - uses: actions/upload-artifact@v4
        with:
          name: gowayy-android-suite-1.0.${{ github.run_number }}
          path: out/*-1.0.${{ github.run_number }}.apk
          if-no-files-found: error

      # Builds from main also refresh the "Android app" release, which gives a
      # direct download link that works in a phone's browser.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest out/gowayy.apk out/gowayy-business.apk out/gowayy-admin.apk \
            "out/gowayy-customer-1.0.${GITHUB_RUN_NUMBER}.apk" "out/gowayy-business-1.0.${GITHUB_RUN_NUMBER}.apk" "out/gowayy-admin-1.0.${GITHUB_RUN_NUMBER}.apk" \
            --target "$GITHUB_SHA" \
            --title "Gowayy Android suite 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Customer, Business and Admin Android apps. Install only the portal appropriate for your role. Built from ${GITHUB_SHA::7}." \
            --latest
