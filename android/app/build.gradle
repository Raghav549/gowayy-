plugins {
    id "com.android.application"
}

def env = System.getenv()
def normalizeUrl = { Object raw ->
    def value = raw.toString().trim()
    if (!value.endsWith("/")) value += "/"
    return value
}
def customerUrl = normalizeUrl(project.findProperty("customerUrl") ?: project.findProperty("appUrl") ?: "https://gowayydlng.vercel.app/")
def businessUrl = normalizeUrl(project.findProperty("businessUrl") ?: "https://gowayy-business.vercel.app/")
def adminUrl = normalizeUrl(project.findProperty("adminUrl") ?: "https://gowayy-admin.vercel.app/")

android {
    namespace "in.gowayy.app"
    compileSdk 35

    defaultConfig {
        applicationId "in.gowayy.app"
        minSdk 24
        targetSdk 35
        // Every CI build gets a higher version code, so a new APK installs over the old one.
        versionCode((env.GITHUB_RUN_NUMBER ?: "1").toInteger())
        versionName "1.0.${env.GITHUB_RUN_NUMBER ?: "0"}"
    }

    flavorDimensions += "portal"
    productFlavors {
        customer {
            dimension "portal"
            applicationId "in.gowayy.app"
            resValue "string", "app_name", "Gowayy"
            resValue "string", "app_url", customerUrl
            resValue "string", "app_host", new URI(customerUrl).host
            manifestPlaceholders = [appHost: new URI(customerUrl).host]
        }
        business {
            dimension "portal"
            applicationId "in.gowayy.business"
            resValue "string", "app_name", "Gowayy Business"
            resValue "string", "app_url", businessUrl
            resValue "string", "app_host", new URI(businessUrl).host
            manifestPlaceholders = [appHost: new URI(businessUrl).host]
        }
        admin {
            dimension "portal"
            applicationId "in.gowayy.admin"
            resValue "string", "app_name", "Gowayy Admin"
            resValue "string", "app_url", adminUrl
            resValue "string", "app_host", new URI(adminUrl).host
            manifestPlaceholders = [appHost: new URI(adminUrl).host]
        }
    }

    signingConfigs {
        release {
            // A private key from repository secrets when configured (see
            // android/README.md); otherwise the bundled sideload key, which keeps
            // the signature stable so updates install without uninstalling.
            def ks = env.ANDROID_KEYSTORE_FILE
            if (ks && file(ks).exists()) {
                storeFile file(ks)
                storePassword env.ANDROID_KEYSTORE_PASSWORD
                keyAlias env.ANDROID_KEY_ALIAS
                keyPassword env.ANDROID_KEY_PASSWORD ?: env.ANDROID_KEYSTORE_PASSWORD
            } else {
                storeFile rootProject.file("keystore/gowayy-sideload.p12")
                storeType "pkcs12"
                storePassword "gowayy-sideload"
                keyAlias "gowayy"
                keyPassword "gowayy-sideload"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
